<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link rel="stylesheet" href="style.css">

<style>
.hero {
    height: 100vh;
    background: linear-gradient(rgba(0,0,0,0.4),rgba(0,0,0,0.4)),
    url('https://c4.wallpaperflare.com/wallpaper/405/673/171/electric-car-wallpaper-preview.jpg');
    background-size: cover;
}

.form-box {
    width: 350px;
    margin: auto;
    padding: 20px;
    background: white;
    margin-top: 10%;
    border-radius: 10px;
}
</style>

</head>
<body>

<div class="hero">
    <div class="form-box">

        <h3 class="text-center">Login</h3>

        <form>
            <input class="form-control mb-2" type="text" placeholder="User ID" required>
            <input class="form-control mb-2" type="password" placeholder="Password" required>
            <button class="btn btn-success w-100">Login</button>
        </form>

        <hr>

        <h4 class="text-center">Register</h4>

        <form>
            <input class="form-control mb-2" type="text" placeholder="User ID" required>
            <input class="form-control mb-2" type="email" placeholder="Email" required>
            <input class="form-control mb-2" type="password" placeholder="Password" required>
            <button class="btn btn-primary w-100">Register</button>
        </form>

    </div>
</div>

</body>
</html>
