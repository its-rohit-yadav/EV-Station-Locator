<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EV Charging Station Locator</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container">
        <a class="navbar-brand" href="#">EV Locator</a>
        <a href="login.html" class="btn btn-light">Login</a>
    </div>
</nav>

<!-- Search -->
<section class="text-center p-5">
    <h1>Find EV Charging Stations</h1>
    <input type="text" id="location-input" class="form-control w-50 mx-auto" placeholder="Enter location">
    <button id="search-button" class="btn btn-primary mt-3">Search</button>
</section>

<!-- Map -->
<div class="container">
    <h3 class="text-center">Map</h3>
    <div id="map"></div>
</div>

<!-- Scripts -->
<script src="script.js"></script>

<script async defer 
src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAP_API_KEY&callback=initMap">
</script>

</html>
